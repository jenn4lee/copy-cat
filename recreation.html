<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  :root {
    --yellow:    #fdd100; 
    --blue:   #1d5eb0;  
    --orange: #f26f4a; 
    --white:  #ffffff;
    --ink:    #151515;
    --line:   0.7cqw;  
  }

  * { box-sizing: border-box; margin: 0; }

  html, body { background: var(--yellow); }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: min(100vw, calc(100dvh * 366 / 500));
    aspect-ratio: 366 / 500;
    container-type: inline-size;
  }

  .balloon {
    position: absolute;
    left: 54.4cqw; top: 30.6cqw;
    width: 29.5cqw; height: 32.5cqw;
    background: var(--orange);
    border: var(--line) solid var(--ink);
    border-radius: 50% / 46% 46% 54% 54%;
    transform: rotate(10deg);
    z-index: 1;
  }

  .knot {
    position: absolute;
    left: 64.8cqw; top: 62.6cqw;
    width: 2.4cqw; height: 2cqw;
    background: var(--ink);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    z-index: 1;
  }

  .string {
    position: absolute;
    left: 64.9cqw; top: 64.2cqw;
    width: 0.5cqw; height: 26cqw;
    background: var(--ink);
    transform: rotate(2deg);
    z-index: 1;
  }

  .ear, .foot, .head, .shirt, .hand {
    position: absolute;
    background: var(--white);
    border: var(--line) solid var(--ink);
  }

  .ear {
    z-index: 1;
    border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%;
  }
  .ear.left  { left: 27.6cqw; top: 38cqw; width: 11.5cqw; height: 26cqw;   transform: rotate(-14deg); }
  .ear.right { left: 41.3cqw; top: 35cqw; width: 11.5cqw; height: 26cqw; transform: rotate(-4deg); }

  .foot { z-index: 1; top: 97.5cqw; height: 8.8cqw; border-radius: 45% 45% 30% 30%; }
  .foot.left  { left: 35.4cqw; width: 9.8cqw; }
  .foot.right { left: 45.8cqw; width: 9.3cqw; }

  .shirt {
    z-index: 2;
    left: 27.3cqw; top: 79cqw;
    width: 35cqw; height: 21.6cqw;
    background: var(--blue);
    border-radius: 38% 38% 12% 12% / 34% 34% 10% 10%;
  }

  .hand { border-radius: 40%; }
  .hand.left  { z-index: 1; left: 23.8cqw; top: 86cqw;   width: 8cqw; height: 7.8cqw; transform: rotate(20deg); }
  .hand.right { z-index: 6; left: 62cqw; top: 79.5cqw; width: 6.5cqw; height: 7.9cqw; }

  .head {
    z-index: 4;
    left: 29cqw; top: 56cqw;
    width: 30.5cqw; height: 26.5cqw;
    border-radius: 50% / 52% 52% 48% 48%;
  }

  .eye {
    position: absolute; z-index: 5;
    top: 72.8cqw;
    width: 1.9cqw; height: 1.9cqw;
    border-radius: 50%;
    background: var(--ink);
  }
  .eye.left  { left: 36.7cqw; }
  .eye.right { left: 50.7cqw; }

  .mouth {
    position: absolute; z-index: 5;
    left: 43.3cqw; top: 76.8cqw;
    width: 3.3cqw; height: 3.3cqw;
  }
  .mouth::before, .mouth::after {
    content: "";
    position: absolute;
    left: 50%; top: 0;
    width: 0.55cqw; height: 100%;
    background: var(--ink);
    transform: translateX(-50%) rotate(45deg);
  }
  .mouth::after { transform: translateX(-50%) rotate(-45deg); }
</style>
</head>

<body>
  <main class="stage">
    <div class="balloon"></div><div class="knot"></div><div class="string"></div>

    <div class="ear left"></div><div class="ear right"></div>
    <div class="foot left"></div><div class="foot right"></div>
    <div class="shirt"></div>
    <div class="hand left"></div>
    <div class="head"></div>
    <div class="eye left"></div><div class="eye right"></div>
    <div class="mouth"></div>
    <div class="hand right"></div>
  </main>
</body>
</html>
